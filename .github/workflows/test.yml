name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          git --version
          jq --version || echo "jq missing"
      - name: Install jq if missing (installer needs it; runtime does not)
        run: |
          command -v jq && exit 0
          case "$RUNNER_OS" in
            macOS) brew install jq ;;
            Windows) choco install jq -y ;;
            Linux) sudo apt-get install -y jq ;;
          esac
      - name: Test suite (throwaway HOME)
        run: bash tests/run.sh

  bash32:
    name: bash 3.2 + busybox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite under bash 3.2
        run: docker run --rm -v "$PWD":/repo:ro bash:3.2 bash -c 'apk add --no-cache git jq >/dev/null && cp -r /repo /src && cd /src && bash tests/run.sh'
